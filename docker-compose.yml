version: '3.8'

services:
  # Development bot service
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novera-bot
    restart: unless-stopped
    ports:
      - "3000:3000"  # Webhook port
      - "4000:4000"  # Health check port
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      MEMWAL_PRIVATE_KEY: ${MEMWAL_PRIVATE_KEY}
      MEMWAL_ACCOUNT_ID: ${MEMWAL_ACCOUNT_ID}
      MEMWAL_SERVER_URL: ${MEMWAL_SERVER_URL:-https://walrus-testnet-rpc.walrus.space}
      MEMWAL_NAMESPACE: ${MEMWAL_NAMESPACE:-novera}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BOT_USERNAME: ${PUBLIC_BOT_USERNAME:-novera_bot}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/app/logs
    networks:
      - novera-network

  # Optional: Web app service (for full stack deployment)
  web:
    image: node:20-alpine
    container_name: novera-web
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm -r run build && pnpm -C apps/web preview"
    ports:
      - "5173:5173"  # Web preview port
    environment:
      NODE_ENV: production
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - novera-network
    depends_on:
      - bot

networks:
  novera-network:
    driver: bridge

volumes:
  logs:
    driver: local
